name: Windows x64 installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ARTIFACT_NAME: Nalaro-AI-Desktop-Windows-x64-Installer
      RELEASE_ZIP_NAME: Nalaro-AI-Desktop-Windows-x64-Installer.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Download pinned llama.cpp CPU runtime and verify digest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'b11871'
          $assetName = "llama-$tag-bin-win-cpu-x64.zip"
          $release = Invoke-RestMethod "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/$tag" -Headers @{ 'User-Agent' = 'Nalaro-AI-Builder' }
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (!$asset) { throw "Binary not found: $assetName" }
          $archive = Join-Path $env:RUNNER_TEMP $assetName
          Invoke-WebRequest $asset.browser_download_url -OutFile $archive
          $got = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($asset.digest -and $asset.digest.StartsWith('sha256:')) {
            if ($got -ne $asset.digest.Substring(7).ToLowerInvariant()) { throw "SHA-256 mismatch" }
          }
          Write-Host "llama.cpp SHA256 $got"
          $extract = Join-Path $env:RUNNER_TEMP 'llama-unpack'
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Recurse -Filter 'llama-server.exe' -File | Select-Object -First 1
          if (!$exe) { throw 'llama-server.exe missing in release' }
          $out = Join-Path $PWD 'src-tauri/runtime'
          New-Item $out -ItemType Directory -Force | Out-Null
          Get-ChildItem $exe.DirectoryName -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination $out -Force
          Invoke-WebRequest "https://raw.githubusercontent.com/ggml-org/llama.cpp/$tag/LICENSE" -OutFile (Join-Path $out 'LLAMA_CPP_LICENSE.txt')
          & (Join-Path $out 'llama-server.exe') --version
      - name: Generate icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw,ImageFont
          import os
          os.makedirs('src-tauri/icons',exist_ok=True)
          im=Image.new('RGBA',(256,256),'#FF5B2E')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((8,8,248,248),radius=55,fill='#FF5B2E')
          try: font=ImageFont.truetype('C:/Windows/Fonts/arialbd.ttf',165)
          except: font=ImageFont.load_default()
          d.text((128,124),'N',anchor='mm',font=font,fill='white')
          im.save('src-tauri/icons/icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - name: Install Tauri CLI
        run: npm install --no-audit --no-fund
      - name: Check browser code
        run: npm run check
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows NSIS
        run: npm run tauri -- build --bundles nsis
      - name: Create release ZIP
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer found in src-tauri/target/release/bundle/nsis' }
          Compress-Archive -Path $installer.FullName -DestinationPath $env:RELEASE_ZIP_NAME -Force
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.RELEASE_ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish public release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.RELEASE_ZIP_NAME }}